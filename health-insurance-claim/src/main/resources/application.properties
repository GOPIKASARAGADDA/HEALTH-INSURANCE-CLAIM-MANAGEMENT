server.port=8085
spring.datasource.url=jdbc:mysql://localhost:3306/healthy
spring.datasource.username=root
spring.datasource.password=chinju
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
server.servlet.session.timeout=1h

management.endpoints.web.exposure.include=mappings
management.endpoints.web.base-path=/actuator

# Log file name (it will be created inside the project root or /logs folder)
logging.file.name=logs/health-insurance.log
 
# Optional: Customize log pattern
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %M %-5level %logger{36} - %m%n 
# Logging levels (fine-tune as needed)
logging.level.root=WARN
logging.level.com.genc.healthinsurance=DEBUG
logging.level.org.springframework.web=INFO
