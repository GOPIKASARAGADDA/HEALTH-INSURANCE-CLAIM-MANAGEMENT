<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Submit Claim</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" th:href="@{/assets/css/style.css}">

    <style>
        body {
            background: #f5f7fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        main {
            flex: 1;
        }
        .claim-form {
            max-width: 600px;
            margin: 3rem auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            padding: 2rem 2.5rem;
        }
        .form-title {
            text-align: center;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 1.5rem;
        }
        .btn-submit {
            width: 100%;
            background-color: #007bff;
            border: none;
        }
        .btn-submit:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
 
    <!-- Include Navbar Fragment -->
    <div th:replace="fragments/navbar :: navbar"></div>
 
    <main>
        <div class="container">
            <div class="claim-form">
                <h3 class="form-title">Submit Insurance Claim</h3>
 
                <form th:action="@{/claims/submit}" th:object="${claim}" method="post">
 
                    <!-- Policy ID -->
                    <div class="mb-3">
                        <label for="policyId" class="form-label">Select Policy</label>
                        <select id="policyId" th:field="*{policy.policyId}" class="form-select" required>
                            <option value="" disabled selected>Select your policy</option>
                            <option th:each="policy : ${policies}"
                                    th:value="${policy.policyId}"
                                    th:text="'Policy #' + ${policy.policyNumber} + ' (' + ${policy.coverageAmount} + ')'">
                            </option>
                        </select>
                    </div>
 
                    <!-- Claim Amount -->
                    <div class="mb-3">
                        <label for="claimAmount" class="form-label">Claim Amount (₹)</label>
                        <input type="number" id="claimAmount" name="claimAmount"
                               class="form-control" placeholder="Enter claim amount" required min="1">
                    </div>
 
                    <!-- Reason -->
                    <div class="mb-3">
                        <label for="claimReason" class="form-label">Reason for Claim</label>
                        <textarea id="claimReason" name="claimReason"
                                  class="form-control" rows="3" placeholder="Describe the reason for claim..." required></textarea>
                    </div>
 
                    <!-- Submit -->
                    <button type="submit" class="btn btn-submit btn-primary mt-3">Submit Claim</button>
                </form>
            </div>
        </div>
    </main>
 
    <!-- Include Footer Fragment -->
    <div th:replace="fragments/footer :: footer"></div>
 
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
	 <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
	 <script th:src="@{/assets/js/script.js}"></script>
</body>
</html>
