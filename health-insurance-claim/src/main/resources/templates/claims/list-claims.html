<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Claim Details</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet"/>
</head>
<body>
<div class="container mt-5">
    <h2>Claim Details</h2>
 
    <table class="table table-bordered">
        <tr>
            <th>Claim ID</th>
            <td th:text="${claim.claimId}"></td>
        </tr>
        <tr>
            <th>Policy</th>
            <td th:text="${claim.policy.policyNumber}"></td>
        </tr>
        <tr>
            <th>Claim Amount</th>
            <td th:text="${claim.claimAmount}"></td>
        </tr>
        <tr>
            <th>Claim Date</th>
            <td th:text="${claim.claimDate}"></td>
        </tr>
        <tr>
            <th>Status</th>
            <td th:text="${claim.claimStatus}"></td>
        </tr>
    </table>
 
    <h4>Uploaded Documents</h4>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Document Name</th>
                <th>Type</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="doc : ${claim.documents}">
                <td th:text="${doc.documentName}"></td>
                <td th:text="${doc.documentType}"></td>
                <td>
                    <a th:href="@{/documents/{docId}(docId=${doc.documentId})}" class="btn btn-info btn-sm">View</a>
                    <form th:action="@{/documents/{docId}/delete(docId=${doc.documentId})}" method="post" style="display:inline">
                        <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${claim.documents == null or #lists.isEmpty(claim.documents)}">
                <td colspan="3">No documents uploaded yet.</td>
            </tr>
        </tbody>
    </table>
 
    <a th:href="@{/documents/upload/{claimId}(claimId=${claim.claimId})}" class="btn btn-primary">Upload Document</a>
    <a th:href="@{/claims/policy/{policyId}(policyId=${claim.policy.policyId})}" class="btn btn-secondary">Back to Policy Claims</a>
</div>
</body>
</html>
