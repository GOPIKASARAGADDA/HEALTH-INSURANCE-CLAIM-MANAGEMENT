
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - InsuraFlow</title>
  <link href="https://cdn.jsdelivr.net/npm.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <div class="container mt-5">
    <h2 class="text-center mb-4">Login to InsuraFlow</h2>
    <div class="row justify-content-center">
      <div class="col-md-6">
        <form id="loginForm">
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" id="username" class="form-control" required>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
        <div id="loginError" class="text-danger mt-3 d-none">Invalid username or password</div>
      </div>
    </div>
  </div>

   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="/assets/js/script.js"></script>
  
  <script>
  $("#loginForm").submit(function(e) {
	  e.preventDefault();
	  const username = $("#username").val();
	  const password = $("#password").val();

	  $.ajax({
	    url: "/api/auth/login",
	    method: "POST",
	    contentType: "application/json",
	    data: JSON.stringify({ username, password }),
	    success: function(response) {
	      // Save login info to localStorage
	      localStorage.setItem("user", JSON.stringify(response));
	      window.location.href = "/index.html"; // Redirect to homepage
	    },
	    error: function() {
	      $("#loginError").removeClass("d-none");
	    }
	  });
	});


  </script>
</body>
</html>
